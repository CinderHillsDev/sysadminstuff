name = "mailcheck-probe"
main = "src/index.js"
compatibility_date = "2026-10-01"

# The probe needs an HTTP surface only so you can read the collected record back.
# If workers.dev is disabled on your account, deploy and create a route on a
# throwaway hostname instead — never on sysadminstuff.net itself.
workers_dev = true

# Create it once:  wrangler kv namespace create PROBE
# then paste the returned id below.
[[kv_namespaces]]
binding = "PROBE"
id = "REPLACE_WITH_ID"

# PROBE_KEY is a secret, kept out of this file:  wrangler secret put PROBE_KEY

# Optional shortcut: create the routing rule at deploy time instead of in the dashboard
# (needs Wrangler >= 4.113). The address must sit on a domain already onboarded to Email
# Routing, and Subaddressing must be enabled in that domain's settings so that
# probe+<token>@… is matched by the plain probe@… rule.
#
# Careful: wrangler replaces this entire list on every deploy, so it is a good fit for a
# throwaway probe and a poor one for a growing product — use the routing-rules API there.
# addresses = ["probe@mailcheck.example.com"]
